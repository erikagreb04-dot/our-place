.pet-card{position:absolute;z-index:5;right:14px;bottom:196px;width:230px;padding:12px 14px;border:0;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;color:#2f211f;text-align:left}.pet-icon{font-size:38px}.pet-card b{font-size:14px}.pet-card small{display:block;color:#786762;margin-top:3px}

.room-pet{position:absolute;z-index:5;left:11%;bottom:177px;width:92px;height:92px;transform-origin:50% 100%;cursor:pointer;transition:transform .45s ease}.cat-art{position:absolute;left:13px;top:10px;width:66px;height:72px;animation:catBreath 2.2s ease-in-out infinite}.cat-body{position:absolute;left:18px;top:30px;width:39px;height:36px;background:#d88d56;border-radius:48% 52% 42% 42%}.cat-head{position:absolute;left:14px;top:8px;width:42px;height:38px;background:#e7a36e;border-radius:48% 48% 45% 45%;z-index:3}.ear{position:absolute;top:-8px;width:15px;height:18px;background:#d88d56;clip-path:polygon(50% 0,100% 100%,0 100%)}.e1{left:3px;transform:rotate(-8deg)}.e2{right:3px;transform:rotate(8deg)}.eye{position:absolute;top:17px;width:4px;height:5px;background:#35231f;border-radius:50%}.eye1{left:11px}.eye2{right:11px}.nose{position:absolute;left:19px;top:24px;width:5px;height:4px;background:#9e5d5d;border-radius:50%}.cat-paw{position:absolute;top:58px;width:13px;height:16px;background:#f2c09b;border-radius:8px;z-index:4}.p1{left:21px}.p2{left:42px}.cat-tail{position:absolute;left:48px;top:38px;width:28px;height:12px;border:8px solid #c77b49;border-left:0;border-bottom:0;border-radius:0 24px 0 0;transform-origin:left center;z-index:0;animation:tail 2.4s ease-in-out infinite}.pet-prop{position:absolute;right:-3px;bottom:0;font-size:25px;z-index:6}.pet-heartfx{position:absolute;z-index:8;left:40px;top:0;color:#ff6682;font-size:22px;opacity:0}.room-pet.pet-eat .cat-art{animation:eatBob .38s ease-in-out infinite alternate;transform:rotate(7deg) translateY(7px)}.room-pet.pet-play .cat-art{animation:playHop .48s ease-in-out infinite alternate}.room-pet.pet-pet .cat-art{animation:happySquish .55s ease-in-out infinite alternate}.room-pet.pet-pet .pet-heartfx{animation:heartUp .8s ease-out infinite}.pet-stage{font-size:12px;color:#88736c;text-align:center;margin:4px 0 10px}
@keyframes catBreath{50%{transform:translateY(1.5px) scaleY(.98)}}@keyframes tail{50%{transform:rotate(18deg)}}@keyframes eatBob{to{transform:rotate(7deg) translateY(10px)}}@keyframes playHop{to{transform:translate(8px,-7px) rotate(4deg)}}@keyframes happySquish{to{transform:scale(1.04,.96) translateY(2px)}}@keyframes heartUp{0%{opacity:0;transform:translateY(8px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1.15)}}


/* v5: the cat lives independently in the room */
.room-pet{left:8%;bottom:174px;width:128px;height:128px;transition:left 3.8s ease-in-out,bottom 2.4s ease-in-out,transform .7s ease;pointer-events:none}
.room-pet .cat-art{transform-origin:50% 100%;zoom:1.34}
.room-pet.walking .cat-art{animation:catWalk .48s ease-in-out infinite alternate}
.room-pet.room-sleep .cat-art{animation:none;transform:scaleY(.72) translateY(22px) rotate(-5deg)}
.room-pet.room-sleep:after{content:"z Z";position:absolute;right:2px;top:6px;color:#fff;font-weight:800;text-shadow:0 2px 7px #40201b}
.room-pet.room-play .cat-art{animation:playHop .55s ease-in-out infinite alternate}
.room-pet.room-wash .cat-art{animation:washCat .65s ease-in-out infinite alternate}
@keyframes catWalk{to{transform:translateY(-5px) rotate(2deg)}}@keyframes washCat{to{transform:rotate(-7deg) translateY(3px)}}
.pet-stage-visual{height:190px;display:grid;place-items:center;overflow:hidden;margin:4px 0 10px}.pet-modal-cat{position:relative;width:150px;height:150px;transform:scale(1.45)}.pet-modal-cat .cat-art{position:absolute;left:30px;top:28px}
.pet-action-note{text-align:center;color:#88736c;font-size:12px;min-height:18px;margin:5px 0 2px}


/* Basenji v1 */
.pet-dog-photo{width:190px;height:190px;border-radius:32px;overflow:hidden;margin:8px auto 12px;background:#eaded8;box-shadow:0 8px 24px rgba(55,31,26,.12)}
.pet-dog-photo img{width:100%;height:100%;object-fit:cover;object-position:center;transform:none;transform-origin:center}
.pet-dog-photo.feed img{animation:dogEat .55s ease-in-out infinite alternate}.pet-dog-photo.pet img{animation:dogCuddle .8s ease-in-out infinite alternate}.pet-dog-photo.play img{animation:dogPlay .55s ease-in-out infinite alternate}
@keyframes dogEat{to{transform:translateY(7px) scale(.98)}}@keyframes dogCuddle{to{transform:scale(1.04) rotate(-1deg)}}@keyframes dogPlay{to{transform:translateY(-5px) rotate(1deg) scale(1.03)}}
.dog-growth{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.dog-growth div{text-align:center;font-size:10px;color:#88736c;padding:8px 3px;border-radius:12px;background:#fff}.dog-growth b{display:block;font-size:20px;margin-bottom:3px}.dog-growth .now{background:#f4e5dc;color:#5b302d}

@media(min-width:561px){body{background:#160e0d}.scene{box-shadow:0 0 70px #000}}

/* v4 animated pet actions */
.action-bowl,.action-hand,.action-ball,.action-heart{display:none;position:absolute;z-index:5;pointer-events:none}
.pet-scene.feed .action-bowl{display:block;font-size:58px;left:42%;bottom:5%;animation:bowlNibble .55s ease-in-out infinite alternate}
.pet-scene.feed img{animation:eatingDog .48s ease-in-out infinite alternate!important}
.pet-scene.pet .action-hand{display:block;font-size:70px;right:14%;top:4%;animation:strokingHand .72s ease-in-out infinite alternate}
.pet-scene.pet .action-heart{display:block;font-size:42px;right:27%;top:30%;animation:floatHeart 1.1s ease-out infinite}
.pet-scene.pet img{animation:cuddleDog .72s ease-in-out infinite alternate!important}
.pet-scene.play .action-ball{display:block;font-size:54px;left:18%;bottom:12%;animation:rollingBall 1.15s ease-in-out infinite alternate}
.pet-scene.play img{animation:playingDog .58s ease-in-out infinite alternate!important}
@keyframes eatingDog{to{transform:translateY(12px) rotate(1.5deg) scale(1.015)}}@keyframes bowlNibble{to{transform:translateX(5px) rotate(4deg)}}
@keyframes strokingHand{to{transform:rotate(-20deg) translate(-20px,34px)}}@keyframes cuddleDog{to{transform:rotate(-2deg) translateX(-9px) scale(1.025)}}
@keyframes floatHeart{0%{opacity:0;transform:translateY(20px) scale(.6)}50%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1.15)}}
@keyframes rollingBall{to{transform:translateX(145px) rotate(280deg)}}@keyframes playingDog{0%{transform:translate(-5px,4px) rotate(-1deg)}50%{transform:translate(10px,-9px) rotate(2deg) scale(1.025)}100%{transform:translate(20px,2px) rotate(-1deg)}}


/* v5 — pet actions play as little scenes */
.pet-actions button:disabled{opacity:.58;transform:none!important;cursor:wait}
.action-progress{display:none;position:absolute;left:8%;right:8%;bottom:9px;height:6px;background:rgba(255,255,255,.65);border-radius:99px;overflow:hidden;z-index:8}
.action-progress i{display:block;width:0;height:100%;background:#b23355;border-radius:99px}
.pet-scene.feed .action-progress,.pet-scene.pet .action-progress,.pet-scene.play .action-progress{display:block}
.pet-scene.feed .action-progress i{animation:actionTimer 8s linear forwards}
.pet-scene.pet .action-progress i{animation:actionTimer 7s linear forwards}
.pet-scene.play .action-progress i{animation:actionTimer 9s linear forwards}
.action-spark{display:none;position:absolute;z-index:6;font-size:34px;color:white;text-shadow:0 2px 8px #8b4c48}
.pet-scene.pet .action-spark{display:block;left:30%;top:25%;animation:sparkFloat 1.4s ease-out infinite .35s}
.pet-scene.feed:after{content:"";position:absolute;left:30%;bottom:18%;width:42%;height:15%;background:radial-gradient(ellipse,rgba(63,30,19,.25),transparent 68%);animation:foodShadow .5s ease-in-out infinite alternate}
.pet-scene.play:after{content:"";position:absolute;left:12%;right:12%;bottom:15%;height:4px;background:rgba(91,47,33,.13);border-radius:50%;animation:playShadow 1.15s ease-in-out infinite alternate}
@keyframes actionTimer{to{width:100%}}
@keyframes sparkFloat{0%{opacity:0;transform:translate(0,18px) scale(.5)}45%{opacity:1}100%{opacity:0;transform:translate(-12px,-38px) scale(1.15)}}
@keyframes foodShadow{to{transform:scaleX(.88)}}
@keyframes playShadow{to{transform:translateX(50px) scaleX(.75)}}

/* More lifelike repeated body motion */
.pet-scene.feed img{animation:eatSequence .72s ease-in-out infinite!important;transform-origin:52% 72%}
.pet-scene.pet img{animation:petSequence 1.15s ease-in-out infinite!important;transform-origin:55% 72%}
.pet-scene.play img{animation:playSequence .82s cubic-bezier(.45,.05,.55,.95) infinite!important;transform-origin:50% 80%}
@keyframes eatSequence{
  0%,100%{transform:translateY(1px) rotate(0) scale(1)}
  35%{transform:translateY(13px) rotate(1.2deg) scale(1.012)}
  55%{transform:translateY(9px) rotate(-.7deg) scale(1.008)}
  75%{transform:translateY(14px) rotate(1deg) scale(1.012)}
}
@keyframes petSequence{
  0%,100%{transform:translateX(0) rotate(0) scale(1)}
  35%{transform:translateX(-8px) rotate(-1.7deg) scale(1.018)}
  70%{transform:translateX(-13px) translateY(3px) rotate(-2.2deg) scale(1.025)}
}
@keyframes playSequence{
  0%,100%{transform:translate(-10px,5px) rotate(-1deg) scale(.99)}
  35%{transform:translate(7px,-10px) rotate(1.8deg) scale(1.025)}
  70%{transform:translate(21px,0) rotate(-1deg) scale(1.01)}
}
.pet-scene.feed .action-bowl{animation:bowlReal .72s ease-in-out infinite!important}
.pet-scene.pet .action-hand{animation:handReal 1.15s ease-in-out infinite!important}
.pet-scene.play .action-ball{animation:ballReal 1.64s cubic-bezier(.45,.05,.55,.95) infinite!important}
@keyframes bowlReal{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-48%) rotate(2deg)}}
@keyframes handReal{0%{transform:rotate(-28deg) translate(6px,-4px)}50%{transform:rotate(-20deg) translate(-18px,30px)}100%{transform:rotate(-26deg) translate(2px,5px)}}
@keyframes ballReal{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(135px) rotate(300deg)}100%{transform:translateX(15px) rotate(520deg)}}


.pet-scene.frame-animation img{animation:none!important;transform:none!important;object-fit:cover!important;width:100%!important;height:100%!important}
.pet-scene.frame-animation .action-bowl,.pet-scene.frame-animation .action-hand,.pet-scene.frame-animation .action-ball,.pet-scene.frame-animation .action-heart,.pet-scene.frame-animation .action-spark{display:none!important}
</style>

async function openGame(){
  const {data,error}=await db.from('house_game').select('*').order('step',{ascending:true});
  if(error){console.error(error);return toast('Игра не загрузилась 😭')}
  const steps=data||[];
  const current=steps.find(x=>!x.choice);
  const completed=steps.filter(x=>x.choice);
  if(!steps.length)return show(`<h2>Строим наш дом 🏡</h2><div class="sub">Этапы игры пока не найдены в базе.</div>`);
  if(!current){
    show(`<h2>Дом построен 🏡</h2><div class="sub">Первый этап закончен вместе. Дальше добавим комнаты: гостиную, спальню, кухню и декор.</div><div class="game-finish"><div class="house">🏡</div><b>${completed.length} совместных решений ♡</b></div>${gameHistory(completed)}`);
    return;
  }
  const progress=Math.round((completed.length/steps.length)*100);
  const mine=current.player===currentUser;
  const options=HOUSE_OPTIONS[current.step]||[];
  show(`<h2>Строим наш дом 🏡</h2>
    <div class="sub">${esc(current.category)} · шаг ${current.step} из ${steps.length}</div>
    <div class="game-progress"><i style="width:${progress}%"></i></div>
    <div class="game-turn"><strong>${mine?'Сейчас твой ход ♡':'Сейчас ход '+esc(current.player)+' ♡'}</strong>
    ${mine?'Выбери то, что нравится тебе. Следующее решение будет за '+partner()+'.':'Ждём выбор. После него откроется следующий этап.'}</div>
    <h3 style="margin:14px 0">${esc(current.question)}</h3>
    ${mine
      ? `<div class="game-options">${options.map((o,i)=>`<button class="game-option" onclick="chooseHouseOption(${current.step},${i})"><span>${o[0]}</span>${esc(o[1])}</button>`).join('')}</div>`
      : `<div class="game-wait">⏳♡</div><div class="sub" style="text-align:center">Ждём ${esc(current.player)}…</div>`}
    ${completed.length?gameHistory(completed):''}`);
}
function gameHistory(completed){
  return `<div class="game-history"><b>Ваш дом уже такой:</b>${completed.slice().reverse().map(x=>`<div class="done">✓ <b>${esc(x.question)}</b><br>${esc(x.choice)} · ${esc(x.chosen_by||x.player)}</div>`).join('')}</div>`;
}
async function chooseHouseOption(step,index){
  const option=(HOUSE_OPTIONS[step]||[])[index];
  if(!option)return;
  const {data:row,error:rerr}=await db.from('house_game').select('*').eq('step',step).single();
  if(rerr||!row)return toast('Не получилось открыть шаг 😭');
  if(row.choice)return toast('Этот выбор уже сделан ♡');
  if(row.player!==currentUser)return toast('Сейчас ход '+row.player+' ♡');
  const {error}=await db.from('house_game').update({
    choice:option[0]+' '+option[1],
    chosen_by:currentUser,
    chosen_at:new Date().toISOString()
  }).eq('step',step).is('choice',null);
  if(error){console.error(error);return toast('Не сохранилось 😭')}
  toast('Выбрано ♡ Теперь ход '+partner());
  await openGame();
}

function playPetFrames(type){
 const img=document.getElementById('petSceneImg');

 img.src=PET_FRAMES[type][0];

  async function uploadPhoto(){
  const input=document.getElementById('photoInput');
  const file=input.files[0];
  if(!file)return;

  const caption=document.getElementById('photoCaption').value.trim();
  const ext=file.name.split('.').pop();
  const path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

  toast('Загружаю фото... 📸');

  const {error:uploadError}=await db.storage
    .from('our-photos')
    .upload(path,file);

  if(uploadError){
    toast('Не получилось загрузить 😭');
    console.error(uploadError);
    return;
  }

  const {error:dbError}=await db.from('daily_photos').insert({
    person:currentUser,
    photo_url:path,
    caption:caption
  });

  if(dbError){
    toast('Фото загрузилось, но не сохранилось 😭');
    console.error(dbError);
    return;
  }

  toast('Фото в нашем альбоме ❤️');
  await openPhotos();
}
let photoDiaryDay=localDay();
async function changePhotoDay(amount){
  const d=new Date(photoDiaryDay+'T12:00:00');
  d.setDate(d.getDate()+amount);

  const today=localDay();
  const next=[
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');

  if(next>today)return;

  photoDiaryDay=next;
  await loadPhotos();
  renderPhotoChallenge();
  updatePhotoDiaryDate();
}

  const el=document.getElementById('photoDiaryDate');

  const today=photoDiaryDay===localDay();

  el.innerHTML=`
    ${today?'Сегодня · ':''}${d.toLocaleDateString('ru-RU',{
      day:'numeric',
      month:'long'
    })} ♡
  `;
}
