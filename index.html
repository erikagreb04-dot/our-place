<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Our Place ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2f211f;background:#2a1717}button,input,textarea{font:inherit}button{cursor:pointer}
:root{--cream:#fff7ef;--wine:#9f334d;--brown:#3b211e;--glass:rgba(255,247,239,.93);--shadow:0 12px 32px rgba(31,14,12,.22)}
#login{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(39,20,18,.25),rgba(39,20,18,.58)),url('room-bg.png') center/cover no-repeat}
.login{width:min(390px,100%);padding:30px 20px;border-radius:30px;background:rgba(255,247,239,.92);backdrop-filter:blur(14px);box-shadow:var(--shadow);text-align:center}.login h1{margin:0;font:42px Georgia,serif}.login p{margin:8px 0 24px;color:#765f59}.login-row{display:flex;gap:10px}.login-row button{flex:1;border:0;border-radius:18px;padding:15px;background:#9f334d;color:#fff;font-weight:700}
#app{display:none;min-height:100svh;position:relative;overflow:hidden;background:#2a1717}.scene{position:relative;width:min(100vw,560px);min-height:100svh;margin:auto;overflow:hidden;background:#2a1717}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(35,15,14,.12),transparent 20%,transparent 70%,rgba(35,15,14,.38))}
.top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 0;color:#fff;text-shadow:0 2px 12px #40201b}.brand h1{font:italic 38px Georgia,serif;margin:0}.brand div{font-size:15px;margin-top:2px}.mini{display:flex;gap:8px}.mini-avatar{width:44px;height:44px;border:2px solid rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;background:#f3d2bd;font-size:23px;box-shadow:var(--shadow)}
.count{position:relative;z-index:4;margin:20px 0 0 20px;width:160px;padding:14px 10px;border-radius:8px;background:rgba(255,244,230,.9);box-shadow:var(--shadow);text-align:center;transform:rotate(-1deg)}.count small{display:block}.count strong{display:block;font:44px Georgia,serif;color:var(--wine);line-height:1.05;margin:5px 0}.count .date{color:#a34258;font-weight:700;font-size:13px;margin-top:5px}
.people{position:absolute;z-index:2;left:50%;top:30%;transform:translateX(-50%);width:94%;pointer-events:none}.people img{display:block;width:100%;filter:drop-shadow(0 12px 14px rgba(31,15,12,.22))}
.status{position:absolute;z-index:5;top:31%;max-width:145px;background:rgba(255,249,244,.96);padding:10px 12px;border-radius:26px;box-shadow:var(--shadow);text-align:center;font-size:12px;line-height:1.25}.status b{display:block;font-size:14px;margin-bottom:2px}.status .emo{font-size:22px;display:block}.status.erika{left:7%}.status.oliver{right:6%}.status:after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;background:inherit;transform:rotate(45deg)}.status.erika:after{right:18px}.status.oliver:after{left:18px}
.plant-card{position:absolute;z-index:5;right:14px;bottom:196px;width:230px;padding:12px 14px;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}.plant-icon{font-size:36px}.plant-card b{font-size:14px}.plant-card small{display:block;color:#786762;margin-top:3px}.bar{height:8px;border-radius:10px;background:#d8cec7;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:15%;background:#4a9c5f;border-radius:10px}
.actions{position:absolute;z-index:6;left:14px;right:14px;bottom:98px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action{border:0;min-height:86px;padding:9px 5px;border-radius:18px;background:rgba(255,248,241,.95);box-shadow:var(--shadow);color:#372622;font-size:11px}.action span{display:block;font-size:27px;margin-bottom:5px}.nav{position:absolute;z-index:7;left:10px;right:10px;bottom:10px;height:78px;padding:7px;border-radius:26px;background:rgba(42,24,22,.92);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:#fff4ee;border-radius:20px;font-size:9px;padding:5px 2px}.nav button span{display:block;font-size:23px;margin-bottom:2px}.nav button.active{background:rgba(164,58,78,.36);color:#ff8799}
.modal-wrap{position:fixed;inset:0;z-index:1000;background:rgba(24,12,12,.5);display:none;align-items:flex-end;justify-content:center}.modal-wrap.show{display:flex}.modal{width:min(560px,100%);max-height:82svh;overflow:auto;background:#fff8f1;border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.25)}.handle{width:46px;height:5px;background:#d7c5bd;border-radius:5px;margin:0 auto 14px}.modal h2{margin:0 0 6px;font:26px Georgia,serif}.sub{color:#88736c;font-size:13px;margin-bottom:16px}.close{float:right;border:0;background:#eaded8;width:34px;height:34px;border-radius:50%}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pick{border:2px solid transparent;background:#fff;border-radius:16px;padding:10px 4px;font-size:25px}.pick.sel{border-color:#b64d63;background:#fff0f2}.field{width:100%;border:0;outline:0;background:#fff;padding:14px;border-radius:16px;margin-top:10px}.primary{width:100%;border:0;border-radius:17px;padding:14px;margin-top:12px;background:#9f334d;color:white;font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:0;border-radius:16px;padding:13px 8px;background:#fff}.gift-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.gift{border:0;background:#fff;border-radius:16px;padding:12px 4px;font-size:25px}.note{background:#fff0cf;padding:14px;border-radius:4px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin:9px 0;transform:rotate(-.4deg)}.wish{background:#fff;padding:12px;border-radius:14px;margin:8px 0}.room-shop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.room-item{border:0;border-radius:18px;background:#fff;padding:15px 6px}.room-item span{display:block;font-size:32px}.earned{margin:12px 0;padding:12px;border-radius:15px;background:#f4e5dc;text-align:center}.float-item{position:absolute;z-index:3;font-size:38px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));pointer-events:none}.toast{position:fixed;z-index:2000;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;background:#402521;color:#fff;padding:11px 17px;border-radius:30px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:561px){body{background:#160e0d}.scene{box-shadow:0 0 70px #000}}
</style>
</head>
<body>
<div id="login"><div class="login"><h1>Our Place ♡</h1><p>Только для Эрики и Оливера</p><div class="login-row"><button onclick="chooseUser('Эрика')">Я Эрика</button><button onclick="chooseUser('Оливер')">Я Оливер</button></div></div></div>
<div id="app"><main class="scene" id="scene">
<img class="bg" id="roomBg" src="room-bg.png" onerror="this.onerror=null;this.src='room-bg'" alt="">
<div class="shade"></div>
<header class="top"><div class="brand"><h1>Our Place ♡</h1><div>Эрика & Оливер</div></div><div class="mini"><div class="mini-avatar">👩🏻</div><div class="mini-avatar">👨🏻</div></div></header>
<div class="count"><small>До встречи</small><strong id="days">—</strong><div id="daysWord">дней</div><div class="date">06.11.2026 ♡</div></div>
<div class="people"><img id="usImg" src="us.png" onerror="this.onerror=null;this.src='us'" alt="Эрика и Оливер"></div>
<button class="status erika" onclick="openStatus('Эрика')"><span class="emo" id="erikaMood">🤍</span><b>Эрика</b><span id="erikaText">нажми и оставь статус</span></button>
<button class="status oliver" onclick="openStatus('Оливер')"><span class="emo" id="oliverMood">🤍</span><b>Оливер</b><span id="oliverText">нажми и оставь статус</span></button>
<button class="plant-card" onclick="openPlant()"><span class="plant-icon" id="plantIcon">🌱</span><span><b>Наше растение ♡</b><small id="plantText">Растёт вместе с вашим домом</small><span class="bar"><i id="plantBar"></i></span></span></button>
<div class="actions"><button class="action" onclick="openMood()"><span>🙂</span>Моё настроение</button><button class="action" onclick="openNeed()"><span>❤️</span>Что мне сейчас нужно</button><button class="action" onclick="openSend()"><span>💌</span>Отправить</button><button class="action" onclick="openRoom()"><span>🎁</span>Добавить в дом</button></div>
<nav class="nav"><button class="active" onclick="home()"><span>🏠</span>Дом</button><button onclick="openPhotos()"><span>🖼️</span>Наши фото</button><button onclick="openNotes()"><span>📝</span>Записки</button><button onclick="openWishes()"><span>🫙</span>Желания</button><button onclick="openPlant()"><span>🌱</span>Растение</button></nav>
</main></div>
<div class="modal-wrap" id="modalWrap" onclick="backdrop(event)"><div class="modal" id="modal"><div class="handle"></div><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://wnutdzgujybadtdxcoci.supabase.co";
const SUPABASE_KEY="sb_publishable_UrqDzYksbHpz2KL4q2F5qw_fv9XmBVI";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MEETING_DATE=new Date(2026,10,6);let currentUser=null,selectedMood=null,selectedNeed=null;
const partner=()=>currentUser==='Эрика'?'Оливер':'Эрика';
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function chooseUser(n){currentUser=n;localStorage.setItem('ourPlaceUser',n);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadAll();startRealtime()}
function calcDays(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const d=Math.max(0,Math.ceil((MEETING_DATE-t)/86400000));days.textContent=d;daysWord.textContent=dayWord(d)}
function dayWord(n){if(n%100>10&&n%100<20)return'дней';if(n%10===1)return'день';if(n%10>=2&&n%10<=4)return'дня';return'дней'}
function show(html){modalBody.innerHTML=html;modalWrap.classList.add('show')}function closeModal(){modalWrap.classList.remove('show')}function backdrop(e){if(e.target===modalWrap)closeModal()}
let tt;function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2300)}
async function loadMoods(){const {data}=await db.from('moods').select('*').eq('day',localDay());erikaMood.textContent='🤍';oliverMood.textContent='🤍';erikaText.textContent='нажми и оставь статус';oliverText.textContent='нажми и оставь статус';(data||[]).forEach(x=>{if(x.person==='Эрика'){erikaMood.textContent=x.mood;erikaText.textContent=x.message||'без слов'}if(x.person==='Оливер'){oliverMood.textContent=x.mood;oliverText.textContent=x.message||'без слов'}})}
function openStatus(who){if(who!==currentUser){toast('Это статус '+who+' ❤️');return}openMood()}
function openMood(){selectedMood=null;show(`<h2>Как ты сегодня?</h2><div class="sub">Это появится прямо возле тебя в комнате до конца дня.</div><div class="grid">${['🥰','😌','🥺','😔','😭','😡','🥱','🤒','🤪','🔥'].map(x=>`<button class="pick" onclick="pickMood(this,'${x}')">${x}</button>`).join('')}</div><input id="statusText" class="field" maxlength="55" placeholder="Например: хочу к тебе 🥺"><button class="primary" onclick="saveMood()">Поставить на сегодня ♡</button>`)}
function pickMood(b,m){selectedMood=m;document.querySelectorAll('.pick').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
async function saveMood(){if(!selectedMood)return toast('Выбери настроение ♡');const message=document.getElementById('statusText').value.trim();const {error}=await db.from('moods').upsert({person:currentUser,mood:selectedMood,message,day:localDay()},{onConflict:'person,day'});if(error){console.error(error);return toast('Не сохранилось 😭')}closeModal();await loadMoods();toast('Статус на сегодня готов ♡')}
function openNeed(){selectedNeed=null;const arr=['🫂 Объятий','❤️ Внимания','💬 Поговорить','😂 Рассмеши меня','💋 Любви','🧘 Побыть одному'];show(`<h2>Что тебе сейчас нужно?</h2><div class="sub">${partner()} увидит это.</div><div class="choices">${arr.map(x=>`<button class="choice" onclick="pickNeed(this,'${x}')">${x}</button>`).join('')}</div><button class="primary" onclick="saveNeed()">Сохранить ♡</button>`)}
function pickNeed(b,n){selectedNeed=n;document.querySelectorAll('.choice').forEach(x=>x.style.background='#fff');b.style.background='#f5d8dc'}
async function saveNeed(){if(!selectedNeed)return toast('Сначала выбери ♡');const {error}=await db.from('needs').upsert({person:currentUser,need:selectedNeed,day:localDay()},{onConflict:'person,day'});if(error)return toast('Не сохранилось 😭');closeModal();toast(partner()+' увидит это ❤️')}
async function openSend(){show(`<h2>Отправить ${partner()} ♡</h2><div class="sub">Маленькое действие прямо сейчас.</div><div class="gift-row">${[['💋','поцелуй'],['🫂','объятие'],['❤️','любовь'],['😂','смешинку'],['🎁','сюрприз']].map(x=>`<button class="gift" onclick="sendGift('${x[0]}','${x[1]}')">${x[0]}</button>`).join('')}</div>`)}
async function sendGift(e,n){const {error}=await db.from('gifts').insert({sender:currentUser,receiver:partner(),gift:e+' '+n});if(error)return toast('Не отправилось 😭');closeModal();toast(e+' отправлено '+partner())}
async function openNotes(){const {data}=await db.from('notes').select('*').order('created_at',{ascending:false}).limit(12);show(`<h2>Записки</h2><div class="sub">Оставь что-нибудь ${partner()} на нашей стене.</div><textarea id="noteText" class="field" maxlength="180" placeholder="Написать записку..."></textarea><button class="primary" onclick="saveNote()">Приклеить записку 📝</button><div>${(data||[]).map(n=>`<div class="note"><b>${n.sender}</b><br>${esc(n.message)}</div>`).join('')||'<div class="sub">Пока записок нет.</div>'}</div>`)}
async function saveNote(){const m=document.getElementById('noteText').value.trim();if(!m)return;const {error}=await db.from('notes').insert({sender:currentUser,receiver:partner(),message:m});if(error)return toast('Не сохранилось');toast('Записка появилась ♡');openNotes()}
async function openWishes(){const {data}=await db.from('wishes').select('*').order('created_at',{ascending:false});show(`<h2>Банка желаний 🫙</h2><div class="sub">Сюда кидаем то, что хотим сделать вместе.</div><input id="wishText" class="field" maxlength="120" placeholder="Например: ночью поехать к океану"><button class="primary" onclick="saveWish()">Добавить желание</button><button class="primary" style="background:#5d3a31" onclick="randomWish()">🎲 Вытянуть случайное</button><div id="wishList">${(data||[]).map(w=>`<div class="wish">♡ ${esc(w.wish)}</div>`).join('')||'<div class="sub">Банка пока пустая.</div>'}</div>`)}
async function saveWish(){const w=document.getElementById('wishText').value.trim();if(!w)return;const {error}=await db.from('wishes').insert({person:currentUser,wish:w});if(error)return toast('Не сохранилось');toast('Желание в банке ♡');openWishes()}
async function randomWish(){const {data}=await db.from('wishes').select('*').eq('completed',false);if(!data?.length)return toast('Сначала добавьте желания');const w=data[Math.floor(Math.random()*data.length)];document.getElementById('wishList').innerHTML=`<div class="earned">🎲 Сегодня выпало:<br><b>${esc(w.wish)}</b></div>`}
const SHOP=[['🪴','растение'],['🕯️','свеча'],['🧸','мишка'],['🪩','диско-шар'],['🐈','кот'],['🖼️','картина'],['💡','лампа'],['🌷','цветы'],['🎮','игра']];
async function openRoom(){const {data}=await db.from('room_items').select('*');const owned=(data||[]).map(x=>x.item);show(`<h2>Наш дом 🏠</h2><div class="sub">Вы добавляете вещи вместе. Всё выбранное остаётся в вашей комнате.</div><div class="earned">В доме уже <b>${owned.length}</b> предметов ♡</div><div class="room-shop">${SHOP.map(x=>`<button class="room-item" ${owned.includes(x[0])?'disabled':''} onclick="addRoomItem('${x[0]}')"><span>${x[0]}</span>${x[1]}${owned.includes(x[0])?'<br>✓':''}</button>`).join('')}</div>`)}
async function addRoomItem(item){const pos=roomPosition(item);const {error}=await db.from('room_items').insert({added_by:currentUser,item,position_x:pos.x,position_y:pos.y});if(error)return toast('Не получилось добавить 😭');await growPlant(8);await loadRoom();toast(item+' теперь живёт у вас дома ♡');openRoom()}
function roomPosition(item){const p={'🪴':[82,52],'🕯️':[18,66],'🧸':[68,62],'🪩':[72,18],'🐈':[22,54],'🖼️':[76,31],'💡':[13,43],'🌷':[30,63],'🎮':[57,66]}[item]||[50,50];return{x:p[0],y:p[1]}}
async function loadRoom(){document.querySelectorAll('.float-item').forEach(x=>x.remove());const {data}=await db.from('room_items').select('*');(data||[]).forEach(x=>{const e=document.createElement('div');e.className='float-item';e.textContent=x.item;e.style.left=(x.position_x||50)+'%';e.style.top=(x.position_y||50)+'%';document.getElementById('scene').appendChild(e)})}
async function growPlant(n){const {data}=await db.from('our_pet').select('*').limit(1).maybeSingle();if(!data)return;await db.from('our_pet').update({growth:Math.min(100,(data.growth||0)+n),updated_at:new Date().toISOString()}).eq('id',data.id)}
async function loadPlant(){const {data}=await db.from('our_pet').select('*').limit(1).maybeSingle();const g=Math.min(100,data?.growth||0);plantBar.style.width=g+'%';plantIcon.textContent=g<25?'🌱':g<60?'🪴':g<90?'🌿':'🌸';plantText.textContent=g<100?`Забота: ${g}% — добавляйте жизнь в дом`:'Оно расцвело вместе с вами ♡'}
async function openPlant(){await loadPlant();show(`<h2>Наше растение 🌱</h2><div class="sub">Оно растёт, когда вы вместе наполняете ваш дом.</div><div style="font-size:90px;text-align:center">${plantIcon.textContent}</div><div class="earned">${plantText.textContent}</div><button class="primary" onclick="carePlant()">💧 Позаботиться сегодня</button>`)}
async function carePlant(){await growPlant(3);await loadPlant();toast('Полили ♡');openPlant()}
function openPhotos(){show(`<h2>Наши фото 📸</h2><div class="sub">Фотостена будет следующим шагом. Для личных фото сначала сделаем безопасное хранение, чтобы они не лежали публично в GitHub.</div>`)}
function home(){closeModal()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkNeed(){const {data}=await db.from('needs').select('*').eq('person',partner()).eq('day',localDay()).maybeSingle();if(data)toast(partner()+' сейчас хочет: '+data.need)}
async function loadAll(){calcDays();await Promise.all([loadMoods(),loadRoom(),loadPlant()]);setTimeout(checkNeed,700)}
function startRealtime(){db.channel('our-place-v2').on('postgres_changes',{event:'*',schema:'public',table:'moods'},loadMoods).on('postgres_changes',{event:'*',schema:'public',table:'room_items'},()=>{loadRoom();loadPlant()}).on('postgres_changes',{event:'*',schema:'public',table:'our_pet'},loadPlant).on('postgres_changes',{event:'INSERT',schema:'public',table:'gifts'},p=>{if(p.new.receiver===currentUser)toast('Для тебя '+p.new.gift+' 💌')}).subscribe()}
window.addEventListener('DOMContentLoaded',()=>{calcDays();const s=localStorage.getItem('ourPlaceUser');if(s==='Эрика'||s==='Оливер')chooseUser(s)})
</script>
</body>
</html>
