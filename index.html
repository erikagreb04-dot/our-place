<html lang="ru">
<head>

<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2f211f;background:#2a1717}button,input,textarea{font:inherit}button{cursor:pointer}
:root{--cream:#fff7ef;--wine:#9f334d;--brown:#3b211e;--glass:rgba(255,247,239,.93);--shadow:0 12px 32px rgba(31,14,12,.22)}
#login{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(39,20,18,.25),rgba(39,20,18,.58)),url('room.png') center/cover no-repeat}
.login{width:min(390px,100%);padding:30px 20px;border-radius:30px;background:rgba(255,247,239,.92);backdrop-filter:blur(14px);box-shadow:var(--shadow);text-align:center}.login h1{margin:0;font:42px Georgia,serif}.login p{margin:8px 0 24px;color:#765f59}.login-row{display:flex;gap:10px}.login-row button{flex:1;border:0;border-radius:18px;padding:15px;background:#9f334d;color:#fff;font-weight:700}
#app{display:none;min-height:100svh;position:relative;overflow:hidden;background:#2a1717}.scene{position:relative;width:min(100vw,560px);min-height:100svh;margin:auto;overflow:hidden;background:#2a1717}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(35,15,14,.12),transparent 20%,transparent 70%,rgba(35,15,14,.38))}
.top{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 0;color:#fff;text-shadow:0 2px 12px #40201b}.brand h1{font:italic 38px Georgia,serif;margin:0}.brand div{font-size:15px;margin-top:2px}.mini{display:flex;gap:8px}.mini-avatar{width:44px;height:44px;border:2px solid rgba(255,255,255,.9);border-radius:50%;display:grid;place-items:center;background:#f3d2bd;font-size:23px;box-shadow:var(--shadow)}
.count{position:relative;z-index:4;margin:20px 0 0 20px;width:160px;padding:14px 10px;border-radius:8px;background:rgba(255,244,230,.9);box-shadow:var(--shadow);text-align:center;transform:rotate(-1deg)}.count small{display:block}.count strong{display:block;font:44px Georgia,serif;color:var(--wine);line-height:1.05;margin:5px 0}.count .date{color:#a34258;font-weight:700;font-size:13px;margin-top:5px}
.people{position:absolute;z-index:2;left:50%;top:30%;transform:translateX(-50%);width:94%;pointer-events:none}.people img{display:block;width:100%;filter:drop-shadow(0 12px 14px rgba(31,15,12,.22))}
.status{position:absolute;z-index:5;top:31%;max-width:145px;background:rgba(255,249,244,.96);padding:10px 12px;border-radius:26px;box-shadow:var(--shadow);text-align:center;font-size:12px;line-height:1.25}.status b{display:block;font-size:14px;margin-bottom:2px}.status .emo{font-size:22px;display:block}.status.erika{left:7%}.status.oliver{right:6%}.status:after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;background:inherit;transform:rotate(45deg)}.status.erika:after{right:18px}.status.oliver:after{left:18px}
.plant-card{position:absolute;z-index:5;right:14px;bottom:196px;width:230px;padding:12px 14px;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}.plant-icon{font-size:36px}.plant-card b{font-size:14px}.plant-card small{display:block;color:#786762;margin-top:3px}.bar{height:8px;border-radius:10px;background:#d8cec7;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:15%;background:#4a9c5f;border-radius:10px}
.actions{position:absolute;z-index:6;left:14px;right:14px;bottom:98px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action{border:0;min-height:86px;padding:9px 5px;border-radius:18px;background:rgba(255,248,241,.95);box-shadow:var(--shadow);color:#372622;font-size:11px}.action span{display:block;font-size:27px;margin-bottom:5px}.nav{position:absolute;z-index:7;left:10px;right:10px;bottom:10px;height:78px;padding:7px;border-radius:26px;background:rgba(42,24,22,.92);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:#fff4ee;border-radius:20px;font-size:9px;padding:5px 2px}.nav button span{display:block;font-size:23px;margin-bottom:2px}.nav button.active{background:rgba(164,58,78,.36);color:#ff8799}
.modal-wrap{position:fixed;inset:0;z-index:1000;background:rgba(24,12,12,.5);display:none;align-items:flex-end;justify-content:center}.modal-wrap.show{display:flex}.modal{width:min(560px,100%);max-height:82svh;overflow:auto;background:#fff8f1;border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.25)}.handle{width:46px;height:5px;background:#d7c5bd;border-radius:5px;margin:0 auto 14px}.modal h2{margin:0 0 6px;font:26px Georgia,serif}.sub{color:#88736c;font-size:13px;margin-bottom:16px}.close{float:right;border:0;background:#eaded8;width:34px;height:34px;border-radius:50%}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.pick{border:2px solid transparent;background:#fff;border-radius:16px;padding:10px 4px;font-size:25px}.pick.sel{border-color:#b64d63;background:#fff0f2}.field{width:100%;border:0;outline:0;background:#fff;padding:14px;border-radius:16px;margin-top:10px}.primary{width:100%;border:0;border-radius:17px;padding:14px;margin-top:12px;background:#9f334d;color:white;font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:0;border-radius:16px;padding:13px 8px;background:#fff}.gift-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.gift{border:0;background:#fff;border-radius:16px;padding:12px 4px;font-size:25px}.note{background:#fff0cf;padding:14px;border-radius:4px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin:9px 0;transform:rotate(-.4deg)}.wish{background:#fff;padding:12px;border-radius:14px;margin:8px 0}.room-shop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.room-item{border:0;border-radius:18px;background:#fff;padding:15px 6px}.room-item span{display:block;font-size:32px}.earned{margin:12px 0;padding:12px;border-radius:15px;background:#f4e5dc;text-align:center}.float-item{position:absolute;z-index:3;font-size:38px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));pointer-events:none}.toast{position:fixed;z-index:2000;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;background:#402521;color:#fff;padding:11px 17px;border-radius:30px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}

.pet-card{position:absolute;z-index:5;right:14px;bottom:196px;width:230px;padding:12px 14px;border:0;border-radius:20px;background:var(--glass);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;color:#2f211f;text-align:left}.pet-icon{font-size:38px}.pet-card b{font-size:14px}.pet-card small{display:block;color:#786762;margin-top:3px}
.game-progress{height:9px;background:#eaded8;border-radius:99px;overflow:hidden;margin:12px 0 18px}.game-progress i{display:block;height:100%;background:#9f334d;border-radius:99px}
.game-turn{padding:14px;border-radius:18px;background:#f4e5dc;margin:10px 0 14px;text-align:center}.game-turn strong{display:block;font-size:16px;margin-bottom:3px}
.game-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.game-option{border:2px solid transparent;border-radius:20px;background:#fff;padding:15px 8px;min-height:105px;color:#372622}.game-option span{display:block;font-size:34px;margin-bottom:7px}
.game-history{margin-top:18px}.game-history .done{background:#fff;padding:10px 12px;border-radius:14px;margin:7px 0;font-size:12px}.game-wait{font-size:54px;text-align:center;padding:12px 0}.game-finish{text-align:center;padding:15px}.game-finish .house{font-size:80px}
.pet-big{text-align:center;font-size:92px;line-height:1.1;margin:10px 0}.pet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pet-actions button{border:0;border-radius:17px;background:#fff;padding:13px 5px;font-size:12px}.pet-actions span{display:block;font-size:28px;margin-bottom:4px}


.status{top:38%;max-width:132px;background:transparent!important;box-shadow:none!important;color:#fff;padding:3px 5px;border:0;text-shadow:0 2px 8px rgba(35,15,14,.95);font-weight:700}.status b{display:none!important}.status .emo{font-size:20px;display:inline;margin-right:4px}.status:after{display:none!important}.status.erika{left:9%}.status.oliver{right:7%}
.room-pet{position:absolute;z-index:5;left:11%;bottom:177px;width:92px;height:92px;transform-origin:50% 100%;cursor:pointer;transition:transform .45s ease}.cat-art{position:absolute;left:13px;top:10px;width:66px;height:72px;animation:catBreath 2.2s ease-in-out infinite}.cat-body{position:absolute;left:18px;top:30px;width:39px;height:36px;background:#d88d56;border-radius:48% 52% 42% 42%}.cat-head{position:absolute;left:14px;top:8px;width:42px;height:38px;background:#e7a36e;border-radius:48% 48% 45% 45%;z-index:3}.ear{position:absolute;top:-8px;width:15px;height:18px;background:#d88d56;clip-path:polygon(50% 0,100% 100%,0 100%)}.e1{left:3px;transform:rotate(-8deg)}.e2{right:3px;transform:rotate(8deg)}.eye{position:absolute;top:17px;width:4px;height:5px;background:#35231f;border-radius:50%}.eye1{left:11px}.eye2{right:11px}.nose{position:absolute;left:19px;top:24px;width:5px;height:4px;background:#9e5d5d;border-radius:50%}.cat-paw{position:absolute;top:58px;width:13px;height:16px;background:#f2c09b;border-radius:8px;z-index:4}.p1{left:21px}.p2{left:42px}.cat-tail{position:absolute;left:48px;top:38px;width:28px;height:12px;border:8px solid #c77b49;border-left:0;border-bottom:0;border-radius:0 24px 0 0;transform-origin:left center;z-index:0;animation:tail 2.4s ease-in-out infinite}.pet-prop{position:absolute;right:-3px;bottom:0;font-size:25px;z-index:6}.pet-heartfx{position:absolute;z-index:8;left:40px;top:0;color:#ff6682;font-size:22px;opacity:0}.room-pet.pet-eat .cat-art{animation:eatBob .38s ease-in-out infinite alternate;transform:rotate(7deg) translateY(7px)}.room-pet.pet-play .cat-art{animation:playHop .48s ease-in-out infinite alternate}.room-pet.pet-pet .cat-art{animation:happySquish .55s ease-in-out infinite alternate}.room-pet.pet-pet .pet-heartfx{animation:heartUp .8s ease-out infinite}.pet-stage{font-size:12px;color:#88736c;text-align:center;margin:4px 0 10px}
@keyframes catBreath{50%{transform:translateY(1.5px) scaleY(.98)}}@keyframes tail{50%{transform:rotate(18deg)}}@keyframes eatBob{to{transform:rotate(7deg) translateY(10px)}}@keyframes playHop{to{transform:translate(8px,-7px) rotate(4deg)}}@keyframes happySquish{to{transform:scale(1.04,.96) translateY(2px)}}@keyframes heartUp{0%{opacity:0;transform:translateY(8px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1.15)}}


/* v5: the cat lives independently in the room */
.room-pet{left:8%;bottom:174px;width:128px;height:128px;transition:left 3.8s ease-in-out,bottom 2.4s ease-in-out,transform .7s ease;pointer-events:none}
.room-pet .cat-art{transform-origin:50% 100%;zoom:1.34}
.room-pet.walking .cat-art{animation:catWalk .48s ease-in-out infinite alternate}
.room-pet.room-sleep .cat-art{animation:none;transform:scaleY(.72) translateY(22px) rotate(-5deg)}
.room-pet.room-sleep:after{content:"z Z";position:absolute;right:2px;top:6px;color:#fff;font-weight:800;text-shadow:0 2px 7px #40201b}
.room-pet.room-play .cat-art{animation:playHop .55s ease-in-out infinite alternate}
.room-pet.room-wash .cat-art{animation:washCat .65s ease-in-out infinite alternate}
@keyframes catWalk{to{transform:translateY(-5px) rotate(2deg)}}@keyframes washCat{to{transform:rotate(-7deg) translateY(3px)}}
.pet-stage-visual{height:190px;display:grid;place-items:center;overflow:hidden;margin:4px 0 10px}.pet-modal-cat{position:relative;width:150px;height:150px;transform:scale(1.45)}.pet-modal-cat .cat-art{position:absolute;left:30px;top:28px}
.pet-action-note{text-align:center;color:#88736c;font-size:12px;min-height:18px;margin:5px 0 2px}


/* Basenji v1 */
.pet-dog-photo{width:190px;height:190px;border-radius:32px;overflow:hidden;margin:8px auto 12px;background:#eaded8;box-shadow:0 8px 24px rgba(55,31,26,.12)}
.pet-dog-photo img{width:410px;height:273px;object-fit:cover;object-position:73% 42%;transform:translate(-117px,-10px) scale(1.45);transform-origin:center}
.pet-dog-photo.feed img{animation:dogEat .55s ease-in-out infinite alternate}.pet-dog-photo.pet img{animation:dogCuddle .8s ease-in-out infinite alternate}.pet-dog-photo.play img{animation:dogPlay .55s ease-in-out infinite alternate}
@keyframes dogEat{to{transform:translate(-117px,3px) scale(1.45) rotate(1deg)}}@keyframes dogCuddle{to{transform:translate(-122px,-7px) scale(1.5) rotate(-1deg)}}@keyframes dogPlay{to{transform:translate(-108px,-18px) scale(1.48) rotate(2deg)}}
.dog-growth{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:12px}.dog-growth div{text-align:center;font-size:10px;color:#88736c;padding:8px 3px;border-radius:12px;background:#fff}.dog-growth b{display:block;font-size:20px;margin-bottom:3px}.dog-growth .now{background:#f4e5dc;color:#5b302d}

@media(min-width:561px){body{background:#160e0d}.scene{box-shadow:0 0 70px #000}}
</style>

<body>
<div id="login"><div class="login"><h1>Our Place ♡</h1><p>Только для Эрики и Оливера</p><div class="login-row"><button onclick="chooseUser('Эрика')">Я Эрика</button><button onclick="chooseUser('Оливер')">Я Оливер</button></div></div></div>
<div id="app"><main class="scene" id="scene">
<img class="bg" id="roomBg" src="room.png" onerror="this.onerror=null;this.src='room-bg'" alt="">
<div class="shade"></div>
<header class="top"><div class="brand"><h1>Our Place ♡</h1><div>Эрика & Оливер</div></div></header>
<div class="count"><small>До встречи</small><strong id="days">—</strong><div id="daysWord">дней</div><div class="date">06.11.2026 ♡</div></div>
<div class="people"><img id="usImg" src="us.png" onerror="this.onerror=null;this.src='us'" alt="Эрика и Оливер"></div>
<button class="status erika" onclick="openStatus('Эрика')"><span class="emo" id="erikaMood">🤍</span><b>Эрика</b><span id="erikaText">нажми и оставь статус</span></button>
<button class="status oliver" onclick="openStatus('Оливер')"><span class="emo" id="oliverMood">🤍</span><b>Оливер</b><span id="oliverText">нажми и оставь статус</span></button>

<div id="roomPet" class="room-pet pet-idle" onclick="openPet()" aria-label="Наш пёс">
<div class="pet-heartfx">♡</div><div class="cat-art"><div class="cat-tail"></div><div class="cat-body"></div><div class="cat-head"><i class="ear e1"></i><i class="ear e2"></i><i class="eye eye1"></i><i class="eye eye2"></i><i class="nose"></i></div><div class="cat-paw p1"></div><div class="cat-paw p2"></div></div><div class="pet-prop" id="petProp"></div></div><div class="actions"><button class="action" onclick="openMood()"><span>🙂</span>Моё настроение</button><button class="action" onclick="openNeed()"><span>❤️</span>Что мне сейчас нужно</button><button class="action" onclick="openSend()"><span>💌</span>Отправить</button><button class="action" onclick="openGame()"><span>🎮</span>Строить дом</button></div>
<nav class="nav"><button class="active" onclick="home()"><span>🏠</span>Дом</button><button onclick="openPhotos()"><span>🖼️</span>Наши фото</button><button onclick="openNotes()"><span>📝</span>Записки</button><button onclick="openGame()"><span>🎮</span>Игра</button><button onclick="openPet()"><span>🐕</span>Питомец</button></nav>
</main></div>
<div class="modal-wrap" id="modalWrap" onclick="backdrop(event)"><div class="modal" id="modal"><div class="handle"></div><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL="https://wnutdzgujybadtdxcoci.supabase.co";
const SUPABASE_KEY="sb_publishable_UrqDzYksbHpz2KL4q2F5qw_fv9XmBVI";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MEETING_DATE=new Date(2026,10,6);let currentUser=null,selectedMood=null,selectedNeed=null;
const partner=()=>currentUser==='Эрика'?'Оливер':'Эрика';
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function chooseUser(n){currentUser=n;localStorage.setItem('ourPlaceUser',n);document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadAll();startRealtime()}
function calcDays(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const d=Math.max(0,Math.ceil((MEETING_DATE-t)/86400000));days.textContent=d;daysWord.textContent=dayWord(d)}
function dayWord(n){if(n%100>10&&n%100<20)return'дней';if(n%10===1)return'день';if(n%10>=2&&n%10<=4)return'дня';return'дней'}
function show(html){modalBody.innerHTML=html;modalWrap.classList.add('show')}function closeModal(){modalWrap.classList.remove('show')}function backdrop(e){if(e.target===modalWrap)closeModal()}
let tt;function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2300)}
async function loadMoods(){const {data}=await db.from('moods').select('*').eq('day',localDay());erikaMood.textContent='🤍';oliverMood.textContent='🤍';erikaText.textContent='нажми и оставь статус';oliverText.textContent='нажми и оставь статус';(data||[]).forEach(x=>{if(x.person==='Эрика'){erikaMood.textContent=x.mood;erikaText.textContent=x.message||'без слов'}if(x.person==='Оливер'){oliverMood.textContent=x.mood;oliverText.textContent=x.message||'без слов'}})}
function openStatus(who){if(who!==currentUser){toast('Это статус '+who+' ❤️');return}openMood()}
function openMood(){selectedMood=null;show(`<h2>Как ты сегодня?</h2><div class="sub">Это появится прямо возле тебя в комнате до конца дня.</div><div class="grid">${['🥰','😌','🥺','😔','😭','😡','🥱','🤒','🤪','🔥'].map(x=>`<button class="pick" onclick="pickMood(this,'${x}')">${x}</button>`).join('')}</div><input id="statusText" class="field" maxlength="55" placeholder="Например: хочу к тебе 🥺"><button class="primary" onclick="saveMood()">Поставить на сегодня ♡</button>`)}
function pickMood(b,m){selectedMood=m;document.querySelectorAll('.pick').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
async function saveMood(){if(!selectedMood)return toast('Выбери настроение ♡');const message=document.getElementById('statusText').value.trim();const {error}=await db.from('moods').upsert({person:currentUser,mood:selectedMood,message,day:localDay()},{onConflict:'person,day'});if(error){console.error(error);return toast('Не сохранилось 😭')}closeModal();await loadMoods();toast('Статус на сегодня готов ♡')}
function openNeed(){selectedNeed=null;const arr=['🫂 Объятий','❤️ Внимания','💬 Поговорить','😂 Рассмеши меня','💋 Любви','🧘 Побыть одному'];show(`<h2>Что тебе сейчас нужно?</h2><div class="sub">${partner()} увидит это.</div><div class="choices">${arr.map(x=>`<button class="choice" onclick="pickNeed(this,'${x}')">${x}</button>`).join('')}</div><button class="primary" onclick="saveNeed()">Сохранить ♡</button>`)}
function pickNeed(b,n){selectedNeed=n;document.querySelectorAll('.choice').forEach(x=>x.style.background='#fff');b.style.background='#f5d8dc'}
async function saveNeed(){if(!selectedNeed)return toast('Сначала выбери ♡');const {error}=await db.from('needs').upsert({person:currentUser,need:selectedNeed,day:localDay()},{onConflict:'person,day'});if(error)return toast('Не сохранилось 😭');closeModal();toast(partner()+' увидит это ❤️')}
async function openSend(){show(`<h2>Отправить ${partner()} ♡</h2><div class="sub">Маленькое действие прямо сейчас.</div><div class="gift-row">${[['💋','поцелуй'],['🫂','объятие'],['❤️','любовь'],['😂','смешинку'],['🎁','сюрприз']].map(x=>`<button class="gift" onclick="sendGift('${x[0]}','${x[1]}')">${x[0]}</button>`).join('')}</div>`)}
async function sendGift(e,n){const {error}=await db.from('gifts').insert({sender:currentUser,receiver:partner(),gift:e+' '+n});if(error)return toast('Не отправилось 😭');closeModal();toast(e+' отправлено '+partner())}
async function openNotes(){const {data}=await db.from('notes').select('*').order('created_at',{ascending:false}).limit(12);show(`<h2>Записки</h2><div class="sub">Оставь что-нибудь ${partner()} на нашей стене.</div><textarea id="noteText" class="field" maxlength="180" placeholder="Написать записку..."></textarea><button class="primary" onclick="saveNote()">Приклеить записку 📝</button><div>${(data||[]).map(n=>`<div class="note"><b>${n.sender}</b><br>${esc(n.message)}</div>`).join('')||'<div class="sub">Пока записок нет.</div>'}</div>`)}
async function saveNote(){const m=document.getElementById('noteText').value.trim();if(!m)return;const {error}=await db.from('notes').insert({sender:currentUser,receiver:partner(),message:m});if(error)return toast('Не сохранилось');toast('Записка появилась ♡');openNotes()}

  1: [

async function openGame(){
  const {data,error}=await db.from('house_game').select('*').order('step',{ascending:true});
  if(error){console.error(error);return toast('Игра не загрузилась 😭')}
  const steps=data||[];
  const current=steps.find(x=>!x.choice);
  const completed=steps.filter(x=>x.choice);
  if(!steps.length)return show(`<h2>Строим наш дом 🏡</h2><div class="sub">Этапы игры пока не найдены в базе.</div>`);
  if(!current){
    show(`<h2>Дом построен 🏡</h2><div class="sub">Первый этап закончен вместе. Дальше добавим комнаты: гостиную, спальню, кухню и декор.</div><div class="game-finish"><div class="house">🏡</div><b>${completed.length} совместных решений ♡</b></div>${gameHistory(completed)}`);
    return;
  }
  const progress=Math.round((completed.length/steps.length)*100);
  const mine=current.player===currentUser;
  const options=HOUSE_OPTIONS[current.step]||[];
  show(`<h2>Строим наш дом 🏡</h2>
    <div class="sub">${esc(current.category)} · шаг ${current.step} из ${steps.length}</div>
    <div class="game-progress"><i style="width:${progress}%"></i></div>
    <div class="game-turn"><strong>${mine?'Сейчас твой ход ♡':'Сейчас ход '+esc(current.player)+' ♡'}</strong>
    ${mine?'Выбери то, что нравится тебе. Следующее решение будет за '+partner()+'.':'Ждём выбор. После него откроется следующий этап.'}</div>
    <h3 style="margin:14px 0">${esc(current.question)}</h3>
    ${mine
      ? `<div class="game-options">${options.map((o,i)=>`<button class="game-option" onclick="chooseHouseOption(${current.step},${i})"><span>${o[0]}</span>${esc(o[1])}</button>`).join('')}</div>`
      : `<div class="game-wait">⏳♡</div><div class="sub" style="text-align:center">Ждём ${esc(current.player)}…</div>`}
    ${completed.length?gameHistory(completed):''}`);
}
function gameHistory(completed){
  return `<div class="game-history"><b>Ваш дом уже такой:</b>${completed.slice().reverse().map(x=>`<div class="done">✓ <b>${esc(x.question)}</b><br>${esc(x.choice)} · ${esc(x.chosen_by||x.player)}</div>`).join('')}</div>`;
}
async function chooseHouseOption(step,index){
  const option=(HOUSE_OPTIONS[step]||[])[index];
  if(!option)return;
  const {data:row,error:rerr}=await db.from('house_game').select('*').eq('step',step).single();
  if(rerr||!row)return toast('Не получилось открыть шаг 😭');
  if(row.choice)return toast('Этот выбор уже сделан ♡');
  if(row.player!==currentUser)return toast('Сейчас ход '+row.player+' ♡');
  const {error}=await db.from('house_game').update({
    choice:option[0]+' '+option[1],
    chosen_by:currentUser,
    chosen_at:new Date().toISOString()
  }).eq('step',step).is('choice',null);
  if(error){console.error(error);return toast('Не сохранилось 😭')}
  toast('Выбрано ♡ Теперь ход '+partner());
  await openGame();
}


function catDrawing(id=''){
 return `<div class="pet-modal-cat" ${id?`id="${id}"`:''}><div class="pet-heartfx">♡</div><div class="cat-art"><div class="cat-tail"></div><div class="cat-body"></div><div class="cat-head"><i class="ear e1"></i><i class="ear e2"></i><i class="eye eye1"></i><i class="eye eye2"></i><i class="nose"></i></div><div class="cat-paw p1"></div><div class="cat-paw p2"></div></div><div class="pet-prop"></div></div>`;
}
let catLifeTimer=null,catLifeBusy=false;
function startCatLife(){
 clearTimeout(catLifeTimer);
 const pet=document.getElementById('roomPet'); if(!pet)return;
 const states=[
  {c:'walking',x:8,d:6500},{c:'room-wash',x:19,d:5500},{c:'walking',x:58,d:7500},
  {c:'room-play',x:63,d:6500},{c:'walking',x:34,d:7000},{c:'room-sleep',x:27,d:11000},
  {c:'walking',x:70,d:7000},{c:'',x:70,d:6500}
 ];
 const run=()=>{
   if(catLifeBusy){catLifeTimer=setTimeout(run,2500);return}
   const s=states[Math.floor(Math.random()*states.length)];
   pet.classList.remove('walking','room-wash','room-play','room-sleep');
   if(s.c)pet.classList.add(s.c);
   pet.style.left=s.x+'%';
   const prop=pet.querySelector('.pet-prop'); if(prop)prop.textContent=s.c==='room-play'?'🧶':'';
   catLifeTimer=setTimeout(run,s.d);
 };
 catLifeTimer=setTimeout(run,1800);
}

function petAge(data){const born=new Date(data.created_at||Date.now());const days=Math.max(0,Math.floor((Date.now()-born.getTime())/86400000));const stage=days<60?1:days<150?2:days<270?3:4;const labels=['','щенок','подросток','юниор','взрослый пёс'];return{days,stage,label:labels[stage],scale:Math.min(1.18,.64+days*.0018)}}}
async function loadPet(){const{data}=await db.from('our_pet').select('*').limit(1).maybeSingle();if(!data)return;const age=petAge(data),pet=document.getElementById('roomPet');if(pet)pet.style.transform=`scale(${age.scale})`;startCatLife();if((data.stage||1)!==age.stage)db.from('our_pet').update({stage:age.stage,updated_at:new Date().toISOString()}).eq('id',data.id)}
async function openPet(){
 const{data}=await db.from('our_pet').select('*').limit(1).maybeSingle();if(!data)return toast('Пёс потерялся 😭');
 const name=(data.name&&data.name!=='???')?data.name:'Наш пёс',h=Math.max(0,Math.min(100,data.hunger??100)),happy=Math.max(0,Math.min(100,data.happiness??100)),affection=Math.max(0,data.affection??0),age=petAge(data);
 show(`<h2>${esc(name)} ♡</h2><div class="sub">Ваш басенджи · растёт вместе с вами.</div>
 <div class="pet-stage">День ${age.days+1} · ${age.label}</div>
 <div class="pet-dog-photo" id="petDogPhoto"><img src="basenji-reference.png" alt="Щенок басенджи"></div>
 <div id="petActionNote" class="pet-action-note">Сейчас отдыхает рядом с вами ♡</div>
 <div class="earned">🥣 Сытость <b>${h}%</b> · ❤️ Счастье <b>${happy}%</b><br>💕 Привязанность <b>${affection}</b></div>
 <div class="pet-actions"><button onclick="petAction('feed')"><span>🥣</span>Покормить</button><button onclick="petAction('pet')"><span>🤍</span>Погладить</button><button onclick="petAction('play')"><span>🧶</span>Поиграть</button></div>
 <div class="dog-growth"><div class="${age.stage===1?'now':''}"><b>🐕</b>Щенок<br>0–2 мес</div><div class="${age.stage===2?'now':''}"><b>🐕</b>Подросток<br>2–5 мес</div><div class="${age.stage===3?'now':''}"><b>🐕</b>Юниор<br>5–9 мес</div><div class="${age.stage===4?'now':''}"><b>🐕</b>Взрослый<br>9+ мес</div></div>
 <input id="petNameInput" class="field" maxlength="20" placeholder="Имя пса" value="${data.name==='???'?'':esc(data.name||'')}"><button class="primary" onclick="savePetName()">Сохранить имя ♡</button>`);
}
function animateRoomPet(type){const pet=document.getElementById('roomPet'),prop=document.getElementById('petProp');if(!pet)return;pet.classList.remove('pet-idle','pet-eat','pet-play','pet-pet');pet.classList.add(type==='feed'?'pet-eat':type==='play'?'pet-play':'pet-pet');if(prop)prop.textContent=type==='feed'?'🥣':type==='play'?'🧶':'';setTimeout(()=>{pet.classList.remove('pet-eat','pet-play','pet-pet');pet.classList.add('pet-idle');if(prop)prop.textContent=''},2600)}
async function petAction(type){
 const{data}=await db.from('our_pet').select('*').limit(1).maybeSingle();if(!data)return;
 let hunger=data.hunger??100,happiness=data.happiness??100,affection=data.affection??0;
 const dog=document.getElementById('petDogPhoto'),note=document.getElementById('petActionNote');if(!dog)return;
 dog.classList.remove('feed','pet','play');let duration=7000;
 if(type==='feed'){hunger=Math.min(100,hunger+15);affection+=1;dog.classList.add('feed');if(note)note.textContent='Ест из миски… ням ♡';duration=8000}
 if(type==='pet'){happiness=Math.min(100,happiness+10);affection+=2;dog.classList.add('pet');if(note)note.textContent='Прижимается к руке и довольно мурчит по-собачьи ♡';duration=7000}
 if(type==='play'){happiness=Math.min(100,happiness+15);hunger=Math.max(0,hunger-3);affection+=2;dog.classList.add('play');if(note)note.textContent='Играет и тянет игрушку ♡';duration=9000}
 catLifeBusy=true;animateRoomPet(type);
 await db.from('our_pet').update({pet_type:'basenji',hunger,happiness,affection,last_fed:type==='feed'?new Date().toISOString():data.last_fed,last_played:type==='play'?new Date().toISOString():data.last_played,updated_at:new Date().toISOString()}).eq('id',data.id);
 setTimeout(()=>{catLifeBusy=false;if(document.getElementById('petDogPhoto'))openPet();loadPet()},duration);
}
async function savePetName(){const name=document.getElementById('petNameInput').value.trim();if(!name)return toast('Дайте псу имя ♡');const{data}=await db.from('our_pet').select('id').limit(1).maybeSingle();if(!data)return;const{error}=await db.from('our_pet').update({name,pet_type:'basenji',updated_at:new Date().toISOString()}).eq('id',data.id);if(error)return toast('Имя не сохранилось 😭');toast('Теперь его зовут '+name+' ♡');loadPet();openPet()}
function openPhotos(){show(`<h2>Наши фото 📸</h2><div class="sub">Фотостена будет следующим шагом. Для личных фото сначала сделаем безопасное хранение, чтобы они не лежали публично в GitHub.</div>`)}
function home(){closeModal()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkNeed(){const {data}=await db.from('needs').select('*').eq('person',partner()).eq('day',localDay()).maybeSingle();if(data)toast(partner()+' сейчас хочет: '+data.need)}
async function loadAll(){calcDays();await Promise.all([loadMoods(),loadPet()]);setTimeout(checkNeed,700)}
function startRealtime(){db.channel('our-place-v3')
.on('postgres_changes',{event:'*',schema:'public',table:'moods'},loadMoods)
.on('postgres_changes',{event:'*',schema:'public',table:'our_pet'},loadPet)
.on('postgres_changes',{event:'*',schema:'public',table:'house_game'},()=>{if(modalWrap.classList.contains('show')&&modalBody.textContent.includes('Строим наш дом'))openGame()})
.on('postgres_changes',{event:'INSERT',schema:'public',table:'gifts'},p=>{if(p.new.receiver===currentUser)toast('Для тебя '+p.new.gift+' 💌')})
.subscribe()}
window.addEventListener('DOMContentLoaded',()=>{calcDays();const s=localStorage.getItem('ourPlaceUser');if(s==='Эрика'||s==='Оливер')chooseUser(s)})
</script>
